name: Publish action version aliases

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: bash -n .github/scripts/*.sh setup-wodby-cli/scripts/*.sh

      - name: Test action version aliases
        run: .github/scripts/update-version-aliases_test.sh

      - name: Test Wodby CLI installer
        run: setup-wodby-cli/scripts/install_test.sh

      - name: Test cache profile detection
        run: setup-wodby-cli/scripts/cache_test.sh

      - name: Publish compatible version aliases
        run: .github/scripts/update-version-aliases.sh "${GITHUB_REF_NAME}"
